name: CI

on:
  push:
    branches: [main, baseline, policy-regression, codex/security-multi-violation-demo]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Parameter scenario preset'
        required: true
        default: 'active'
        type: choice
        options:
          - active
          - compliant
          - regression

jobs:
  application-tests:
    name: Application Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  bicep-validation:
    name: Bicep Syntax & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Bicep Template
        run: |
          az bicep build --file infra/main.bicep --outfile compiled-template.json
          echo "Bicep template compiled successfully without errors."

      - name: Offline Network Provisioning Preflight
        run: npx tsx scripts/validate-network-preflight.ts compiled-template.json infra/parameters/active.json provisioning-result.json

      - name: Upload Offline Provisioning Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-evidence
          path: |
            provisioning-result.json
            compiled-template.json
            infra/parameters/active.json
          if-no-files-found: error
          retention-days: 7

  deployment-policy:
    name: Deployment Policy Check
    runs-on: ubuntu-latest
    # Evaluate policy independently so an infrastructure failure cannot hide it.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Select Parameter Fixture
        run: |
          if [ "${{ inputs.scenario }}" = "compliant" ]; then
            npm run scenario:compliant
          elif [ "${{ inputs.scenario }}" = "regression" ]; then
            npm run scenario:regression
          fi

      - name: Evaluate Deployment Policy
        id: policy_eval
        run: npm run validate:policy

      - name: Package Investigation Context Bundle
        if: always()
        run: npx tsx scripts/package-evidence.ts infra/parameters/active.json policy-result.json investigation-context.json

      - name: Upload Policy Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-result
          path: |
            policy-result.json
            investigation-context.json
            infra/parameters/active.json
          retention-days: 7
