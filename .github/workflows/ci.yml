name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  application-tests:
    name: Application Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  bicep-validation:
    name: Bicep Syntax & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Bicep Template
        run: |
          set -o pipefail
          az bicep build --file infra/main.bicep --outfile compiled-template.json 2>&1 | tee bicep-build.log
          echo "Bicep template compiled successfully without errors."

      - name: Offline Network Provisioning Preflight
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx tsx scripts/validate-network-preflight.ts compiled-template.json infra/parameters/active.json provisioning-result.json

      - name: Upload Offline Provisioning Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-evidence
          path: |
            bicep-build.log
            provisioning-result.json
            compiled-template.json
            infra/parameters/active.json
          if-no-files-found: error
          retention-days: 7

  deployment-policy:
    name: Deployment Policy Check
    runs-on: ubuntu-latest
    # Independent checks preserve policy findings when infrastructure fails.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Evaluate Deployment Policy
        id: policy_eval
        run: npm run validate:policy

      - name: Package Investigation Context Bundle
        if: always()
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx tsx scripts/package-evidence.ts infra/parameters/active.json policy-result.json investigation-context.json

      - name: Upload Policy Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-result
          path: |
            policy-result.json
            investigation-context.json
            infra/parameters/active.json
          retention-days: 7

  shared-module-assessment:
    name: Registered Consumer Assessment
    runs-on: ubuntu-latest
    # This job has no secrets or write token. Findings are review evidence;
    # the existing three deterministic required checks retain their meaning.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Select the registered shared module
        id: scope
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASELINE_SHA" "$SOURCE_HEAD_SHA" -- infra/modules/hostingPlan.bicep | grep -q .; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
            git show "$BASELINE_SHA:infra/modules/hostingPlan.bicep" > "$RUNNER_TEMP/baseline-hostingPlan.bicep"
            git show "$SOURCE_HEAD_SHA:infra/modules/hostingPlan.bicep" > "$RUNNER_TEMP/candidate-hostingPlan.bicep"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "No registered shared module changed. No consumer compilation or model call needed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compile registered consumers and record effective configuration
        if: steps.scope.outputs.selected == 'true'
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          npx tsx scripts/assess-shared-module.ts --baseline-module "$RUNNER_TEMP/baseline-hostingPlan.bicep" --candidate-module "$RUNNER_TEMP/candidate-hostingPlan.bicep" --output shared-module-assessment.json --templates-dir consumer-templates
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then exit "$result"; fi
          echo "Consumer assessment exit $result. A verified requirement finding is recorded for the separate review; it does not change the three baseline gates." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload registered sample consumer evidence
        if: always() && steps.scope.outputs.selected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shared-module-evidence
          path: |
            shared-module-assessment.json
            consumer-templates/
          if-no-files-found: error
          retention-days: 7
