name: CI

on:
  push:
    branches: [main, baseline, policy-regression]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Parameter scenario preset'
        required: true
        default: 'active'
        type: choice
        options:
          - active
          - compliant
          - regression

jobs:
  application-tests:
    name: Application Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  bicep-validation:
    name: Bicep Syntax & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bicep Template
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          echo "Bicep template compiled successfully without errors."

  deployment-policy:
    name: Deployment Policy Check
    runs-on: ubuntu-latest
    needs: [application-tests, bicep-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Select Parameter Fixture
        run: |
          if [ "${{ inputs.scenario }}" = "compliant" ]; then
            npm run scenario:compliant
          elif [ "${{ inputs.scenario }}" = "regression" ]; then
            npm run scenario:regression
          fi

      - name: Evaluate Deployment Policy
        id: policy_eval
        run: npm run validate:policy

      - name: Package Investigation Context Bundle
        if: always()
        run: npx tsx scripts/package-evidence.ts infra/parameters/active.json policy-result.json investigation-context.json

      - name: Upload Policy Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-result
          path: |
            policy-result.json
            investigation-context.json
          retention-days: 7
